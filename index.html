<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect Four</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Connect Four!</h1>
    <div class="gameBoard">
      <div class="column">
        <div class="slot" data-row="0" data-column="0">0</div>
        <div class="slot" data-row="1" data-column="0">1</div>
        <div class="slot" data-row="2" data-column="0">2</div>
        <div class="slot" data-row="3" data-column="0">3</div>
        <div class="slot" data-row="4" data-column="0">4</div>
        <div class="slot" data-row="5" data-column="0">5</div>
      </div>
      <div class="column">
        <div class="slot" data-row="0" data-column="1">1</div>
        <div class="slot" data-row="1" data-column="1">0</div>
        <div class="slot" data-row="2" data-column="1">0</div>
        <div class="slot" data-row="3" data-column="1">0</div>
        <div class="slot" data-row="4" data-column="1">0</div>
        <div class="slot" data-row="5" data-column="1">0</div>
      </div>
      <div class="column">
        <div class="slot" data-row="0" data-column="2">2</div>
        <div class="slot" data-row="1" data-column="2">0</div>
        <div class="slot" data-row="2" data-column="2">0</div>
        <div class="slot" data-row="3" data-column="2">0</div>
        <div class="slot" data-row="4" data-column="2">0</div>
        <div class="slot" data-row="5" data-column="2">0</div>
      </div>
      <div class="column">
        <div class="slot" data-row="0" data-column="3">3</div>
        <div class="slot" data-row="1" data-column="3">0</div>
        <div class="slot" data-row="2" data-column="3">0</div>
        <div class="slot" data-row="3" data-column="3">0</div>
        <div class="slot" data-row="4" data-column="3">0</div>
        <div class="slot" data-row="5" data-column="3">0</div>
      </div>
      <div class="column">
        <div class="slot" data-row="0" data-column="4">4</div>
        <div class="slot" data-row="1" data-column="4">0</div>
        <div class="slot" data-row="2" data-column="4">0</div>
        <div class="slot" data-row="3" data-column="4">0</div>
        <div class="slot" data-row="4" data-column="4">0</div>
        <div class="slot" data-row="5" data-column="4">0</div>
      </div>
      <div class="column">
        <div class="slot" data-row="0" data-column="5">5</div>
        <div class="slot" data-row="1" data-column="5">0</div>
        <div class="slot" data-row="2" data-column="5">0</div>
        <div class="slot" data-row="3" data-column="5">0</div>
        <div class="slot" data-row="4" data-column="5">0</div>
        <div class="slot" data-row="5" data-column="5">0</div>
      </div>
      <div class="column">
        <div class="slot" data-row="0" data-column="6">6</div>
        <div class="slot" data-row="1" data-column="6">0</div>
        <div class="slot" data-row="2" data-column="6">0</div>
        <div class="slot" data-row="3" data-column="6">0</div>
        <div class="slot" data-row="4" data-column="6">0</div>
        <div class="slot" data-row="5" data-column="6">0</div>
      </div>
    </div>
    <script src="connectfour.js"></script>
  </body>
</html>

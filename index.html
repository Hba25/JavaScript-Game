<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connect Four</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=autoplay"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Single:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="mainNav">
      <h1 class="bitcount-grid-single">Connect Four!</h1>
      <span class="btnText">
        <button class="btnNewGame">New game</button>
        <span class="material-symbols-outlined">autoplay</span>
      </span>
    </div>

    <div class="mainBoard">
      <div class="scoreBoard">
        Scoreboard
        <br />
        <div class="scoreCounter">
          Red: <span class="p1Score"></span> Gold: <span class="p2Score"></span>
        </div>
      </div>
    </div>

    <div class="gameBoard">
      <div class="column">
        <div class="slot" data-row="0" data-column="0"></div>
        <div class="slot" data-row="1" data-column="0"></div>
        <div class="slot" data-row="2" data-column="0"></div>
        <div class="slot" data-row="3" data-column="0"></div>
        <div class="slot" data-row="4" data-column="0"></div>
        <div class="slot" data-row="5" data-column="0"></div>
      </div>
      <div class="column">
        <div class="slot" data-row="0" data-column="1"></div>
        <div class="slot" data-row="1" data-column="1"></div>
        <div class="slot" data-row="2" data-column="1"></div>
        <div class="slot" data-row="3" data-column="1"></div>
        <div class="slot" data-row="4" data-column="1"></div>
        <div class="slot" data-row="5" data-column="1"></div>
      </div>
      <div class="column">
        <div class="slot" data-row="0" data-column="2"></div>
        <div class="slot" data-row="1" data-column="2"></div>
        <div class="slot" data-row="2" data-column="2"></div>
        <div class="slot" data-row="3" data-column="2"></div>
        <div class="slot" data-row="4" data-column="2"></div>
        <div class="slot" data-row="5" data-column="2"></div>
      </div>
      <div class="column">
        <div class="slot" data-row="0" data-column="3"></div>
        <div class="slot" data-row="1" data-column="3"></div>
        <div class="slot" data-row="2" data-column="3"></div>
        <div class="slot" data-row="3" data-column="3"></div>
        <div class="slot" data-row="4" data-column="3"></div>
        <div class="slot" data-row="5" data-column="3"></div>
      </div>
      <div class="column">
        <div class="slot" data-row="0" data-column="4"></div>
        <div class="slot" data-row="1" data-column="4"></div>
        <div class="slot" data-row="2" data-column="4"></div>
        <div class="slot" data-row="3" data-column="4"></div>
        <div class="slot" data-row="4" data-column="4"></div>
        <div class="slot" data-row="5" data-column="4"></div>
      </div>
      <div class="column">
        <div class="slot" data-row="0" data-column="5"></div>
        <div class="slot" data-row="1" data-column="5"></div>
        <div class="slot" data-row="2" data-column="5"></div>
        <div class="slot" data-row="3" data-column="5"></div>
        <div class="slot" data-row="4" data-column="5"></div>
        <div class="slot" data-row="5" data-column="5"></div>
      </div>
      <div class="column">
        <div class="slot" data-row="0" data-column="6"></div>
        <div class="slot" data-row="1" data-column="6"></div>
        <div class="slot" data-row="2" data-column="6"></div>
        <div class="slot" data-row="3" data-column="6"></div>
        <div class="slot" data-row="4" data-column="6"></div>
        <div class="slot" data-row="5" data-column="6"></div>
      </div>
    </div>
    <div class="winOverlay">
      <div class="winCard">
        <h1 class="winText">`${currentPlayer} is the winner!`</h1>
        <button class="btnNewGameOverlay">
          <span class="material-symbols-outlined">autoplay</span>
        </button>
      </div>
    </div>
    <script src="connectfour.js"></script>
  </body>
</html>
